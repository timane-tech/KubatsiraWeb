<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <title>Kubatsira Microcrédito</title>
  <meta name="description" content="Gestão de microcrédito Kubatsira">
  <meta name="google" content="notranslate"><!-- a app tem o seu próprio Inglês (Configurações › Idioma) -->
  <meta name="theme-color" content="#1f3a5f">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kubatsira">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <!-- Tema (Sistema / Claro / Escuro), escolhido nas Configurações: aplicado já, antes de desenhar -->
  <script>try { document.documentElement.dataset.tema = localStorage.getItem("kub_tema") || "sistema"; } catch (e) { document.documentElement.dataset.tema = "sistema"; }</script>
</head>
<body>
  <!-- Ecrã: Ligar (setup) -->
  <section id="ecra-ligar" class="ecra"></section>
  <!-- Ecrã: Entrar (login) -->
  <section id="ecra-login" class="ecra"></section>
  <!-- Ecrã principal (com cabeçalho + conteúdo + barra inferior) -->
  <section id="ecra-app" class="ecra">
    <header class="cabecalho" id="cabecalho"></header>
    <main class="conteudo" id="conteudo"></main>
    <nav class="barra-inferior" id="barra-inferior"></nav>
  </section>

  <!-- Diálogo / folha deslizante -->
  <div class="fundo-escuro" id="fundo-escuro">
    <div class="folha" id="folha"></div>
  </div>
  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- Apanha-erros: se a app não carregar (ecrã branco), mostra a mensagem em vez de branco -->
  <script>
    window.__err = [];
    window.addEventListener("error", function (e) {
      window.__err.push((e.message || "erro") + "  (" + ((e.filename || "").split("/").pop()) + ":" + (e.lineno || "?") + ")");
    });
    window.addEventListener("unhandledrejection", function (e) {
      window.__err.push("Promise: " + ((e.reason && e.reason.message) || e.reason || "erro"));
    });
    window.addEventListener("load", function () {
      setTimeout(function () {
        if (!document.querySelector(".ecra.ativo")) {
          document.body.innerHTML =
            '<div style="padding:26px 20px;font-family:-apple-system,system-ui,sans-serif;color:#1c2430">' +
            '<h2 style="color:#c0392b;margin:0 0 10px">A app não abriu</h2>' +
            '<p style="color:#5e6b7e">' + (window.__err.length ? "Erro detetado:" : "Não apanhei um erro de JavaScript — pode ser a cache antiga. Feche e volte a abrir, ou remova o ícone e adicione de novo.") + '</p>' +
            (window.__err.length ? '<pre style="white-space:pre-wrap;background:#fdecea;border:1px solid #f3c6c1;border-radius:10px;padding:12px;font-size:13px;color:#a4211f">' + window.__err.join("\n") + '</pre>' : '') +
            '<p style="color:#5e6b7e;font-size:13px">Versão: <b>' + (window.KUB_VER || "?") + '</b></p></div>';
        }
      }, 1800);
    });
  </script>
  <script>window.KUB_VER = "32";</script>

  <script src="dicionario.js"></script>
  <script src="idioma.js"></script>
  <script src="icones.js"></script>
  <script src="regras.js"></script>
  <script src="db.js"></script>
  <script src="dados.js"></script>
  <script src="app.js"></script>
</body>
</html>
